<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8 to MP4 Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        darkbg: '#0F172A',
                        cardbg: '#1E293B'
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-darkbg text-white min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-secondary/20 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full max-w-lg bg-cardbg/80 backdrop-blur-xl rounded-2xl shadow-2xl border border-gray-700/50 p-8 transform transition-all hover:scale-[1.01]">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-primary to-blue-600 mb-4 shadow-lg shadow-primary/30">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-white">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                M3U8 to MP4
            </h1>
            <p class="text-gray-400 mt-2 text-sm">Convert streaming videos to MP4 easily</p>
        </div>

        <!-- Form -->
        <div class="space-y-5">
            <div>
                <label for="url" class="block text-sm font-medium text-gray-300 mb-1.5 ml-1">M3U8 URL</label>
                <div class="relative">
                    <input type="text" id="url" 
                        class="w-full bg-gray-900/50 border border-gray-600 text-white text-sm rounded-xl focus:ring-2 focus:ring-primary focus:border-primary block p-3.5 pl-10 transition-all placeholder-gray-500" 
                        placeholder="https://example.com/video.m3u8">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    </div>
                </div>
            </div>

            <div>
                <label for="referer" class="block text-sm font-medium text-gray-300 mb-1.5 ml-1">
                    Referer <span class="text-xs text-gray-500 font-normal">(Optional)</span>
                </label>
                <div class="relative">
                    <input type="text" id="referer" 
                        class="w-full bg-gray-900/50 border border-gray-600 text-white text-sm rounded-xl focus:ring-2 focus:ring-primary focus:border-primary block p-3.5 pl-10 transition-all placeholder-gray-500" 
                        placeholder="https://website-source.com">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    </div>
                </div>
            </div>

            <button id="convertBtn" onclick="startConvert()" 
                class="w-full text-white bg-gradient-to-r from-primary to-blue-600 hover:from-blue-600 hover:to-blue-700 focus:ring-4 focus:ring-blue-800 font-medium rounded-xl text-sm px-5 py-3.5 text-center transition-all shadow-lg shadow-primary/25 flex justify-center items-center group">
                <span id="btnText">Convert Now</span>
                <svg id="btnIcon" class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                
                <!-- Loader (Hidden by default) -->
                <svg id="btnLoader" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <!-- Status Card -->
        <div id="statusCard" class="hidden mt-6 bg-gray-900/50 rounded-xl border border-gray-700 p-4 transition-all">
            <div class="flex items-center space-x-4">
                <div id="statusIcon" class="flex-shrink-0">
                    <!-- Icons will be injected here -->
                </div>
                <div class="flex-1 min-w-0">
                    <p id="statusTitle" class="text-sm font-medium text-white truncate">
                        Processing...
                    </p>
                    <p id="statusMessage" class="text-xs text-gray-400 truncate">
                        Please wait while we convert your video.
                    </p>
                </div>
            </div>

            <!-- Progress Bar (Indeterminate for now) -->
            <div id="progressBarContainer" class="w-full bg-gray-700 rounded-full h-1.5 mt-4 hidden">
                <div class="bg-primary h-1.5 rounded-full w-full animate-pulse-fast"></div>
            </div>

            <!-- Action Area -->
            <div id="actionArea" class="mt-4 hidden">
                <a href="#" id="downloadBtn" class="flex items-center justify-center w-full px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 focus:ring-4 focus:ring-green-800 transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download MP4
                </a>
            </div>
             <!-- Error Area -->
             <div id="errorArea" class="mt-2 hidden">
                <p id="errorDetails" class="text-xs text-red-400 break-all bg-red-900/20 p-2 rounded border border-red-900/50"></p>
            </div>
        </div>
    </div>

    <script>
        let currentTaskId = null;
        let pollInterval = null;

        const UI = {
            btn: document.getElementById('convertBtn'),
            btnText: document.getElementById('btnText'),
            btnIcon: document.getElementById('btnIcon'),
            btnLoader: document.getElementById('btnLoader'),
            statusCard: document.getElementById('statusCard'),
            statusIcon: document.getElementById('statusIcon'),
            statusTitle: document.getElementById('statusTitle'),
            statusMessage: document.getElementById('statusMessage'),
            progressBar: document.getElementById('progressBarContainer'),
            actionArea: document.getElementById('actionArea'),
            downloadBtn: document.getElementById('downloadBtn'),
            errorArea: document.getElementById('errorArea'),
            errorDetails: document.getElementById('errorDetails')
        };

        const ICONS = {
            processing: `<div class="relative flex h-10 w-10 items-center justify-center rounded-full bg-yellow-500/20 text-yellow-500"><svg class="h-6 w-6 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></div>`,
            completed: `<div class="flex h-10 w-10 items-center justify-center rounded-full bg-green-500/20 text-green-500"><svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div>`,
            failed: `<div class="flex h-10 w-10 items-center justify-center rounded-full bg-red-500/20 text-red-500"><svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></div>`
        };

        function setLoading(isLoading) {
            UI.btn.disabled = isLoading;
            if (isLoading) {
                UI.btnText.textContent = 'Processing...';
                UI.btnIcon.classList.add('hidden');
                UI.btnLoader.classList.remove('hidden');
                UI.btn.classList.add('cursor-not-allowed', 'opacity-75');
            } else {
                UI.btnText.textContent = 'Convert Now';
                UI.btnIcon.classList.remove('hidden');
                UI.btnLoader.classList.add('hidden');
                UI.btn.classList.remove('cursor-not-allowed', 'opacity-75');
            }
        }

        async function startConvert() {
            const url = document.getElementById('url').value.trim();
            const referer = document.getElementById('referer').value.trim();

            if (!url) {
                alert('Please enter a valid M3U8 URL');
                return;
            }

            setLoading(true);
            UI.statusCard.classList.add('hidden');
            UI.errorArea.classList.add('hidden');

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, referer })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Conversion failed to start');

                currentTaskId = data.task_id;
                
                // Show Status Card
                UI.statusCard.classList.remove('hidden');
                updateStatusUI('processing');
                
                // Start Polling
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(checkStatus, 2000);

            } catch (error) {
                setLoading(false);
                UI.statusCard.classList.remove('hidden');
                updateStatusUI('failed', error.message);
            }
        }

        async function checkStatus() {
            if (!currentTaskId) return;

            try {
                const response = await fetch(`/status/${currentTaskId}`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();

                if (data.status === 'completed') {
                    clearInterval(pollInterval);
                    updateStatusUI('completed');
                    setLoading(false);
                } else if (data.status === 'failed') {
                    clearInterval(pollInterval);
                    updateStatusUI('failed', data.error);
                    setLoading(false);
                } else {
                    // Still processing
                    updateStatusUI('processing');
                }

            } catch (error) {
                console.error('Polling error:', error);
                // Don't stop polling immediately on one network error, but maybe warn?
            }
        }

        function updateStatusUI(status, message = '') {
            UI.statusIcon.innerHTML = ICONS[status] || ICONS.processing;
            
            if (status === 'processing') {
                UI.statusTitle.textContent = 'Converting Video...';
                UI.statusMessage.textContent = 'This may take a few minutes depending on the video length.';
                UI.progressBar.classList.remove('hidden');
                UI.actionArea.classList.add('hidden');
                UI.errorArea.classList.add('hidden');
            } else if (status === 'completed') {
                UI.statusTitle.textContent = 'Conversion Complete!';
                UI.statusMessage.textContent = 'Your video is ready for download.';
                UI.progressBar.classList.add('hidden');
                UI.actionArea.classList.remove('hidden');
                UI.errorArea.classList.add('hidden');
                
                UI.downloadBtn.href = `/download/${currentTaskId}`;
            } else if (status === 'failed') {
                UI.statusTitle.textContent = 'Conversion Failed';
                UI.statusMessage.textContent = 'Something went wrong during the process.';
                UI.progressBar.classList.add('hidden');
                UI.actionArea.classList.add('hidden');
                
                UI.errorArea.classList.remove('hidden');
                UI.errorDetails.textContent = message || 'Unknown error occurred.';
            }
        }
    </script>
</body>
</html>
