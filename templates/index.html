<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetchly Pro</title>
    <meta name="theme-color" content="#141517">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v={{ cache_version }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-layout">
    
    <!-- Left: Main Action Area -->
    <main class="main-content">
        <header class="mb-12">
            <div class="flex items-center gap-2 mb-6">
                <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <span class="font-bold tracking-tight text-white">Fetchly</span>
                <span class="px-1.5 py-0.5 text-[10px] font-medium bg-[#2e3036] text-[#9fa2ac] rounded">PRO</span>
            </div>
            
            <h1 class="text-4xl sm:text-5xl text-white mb-4 tracking-tight">Media Extraction<br>Utility</h1>
            <p class="text-lg text-[#9fa2ac] max-w-xl">
                Professional-grade downloader for YouTube, Twitter, TikTok, and Instagram. 
                Optimized for high-bitrate archival.
            </p>
        </header>

        <div class="w-full max-w-3xl">
            <!-- URL Input -->
            <div class="input-group relative group">
                <input type="text" id="url" 
                    class="hero-input font-mono" 
                    placeholder="Paste URL here (cmd+v)" 
                    autocomplete="off">
                
                <div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-2">
                    <button id="clearBtn" class="hidden p-1 text-[#9fa2ac] hover:text-white transition-colors" title="Clear">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                    <button id="pasteBtn" class="p-1 text-[#9fa2ac] hover:text-white transition-colors" title="Paste">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    </button>
                </div>
            </div>

            <!-- Fetch Button -->
            <button id="fetchBtn" class="btn btn-primary w-full sm:w-auto min-w-[160px]">
                <span id="fetchContent">Analyze Stream</span>
                <span id="fetchLoader" class="hidden flex items-center gap-2">
                    <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Processing...
                </span>
            </button>

            <!-- Usage Info -->
            <div id="usageInfo" class="mt-4 text-xs text-[#656870] font-mono"></div>

            <!-- Format Selection Area -->
            <div id="formatSection" class="hidden mt-10 border-t border-[#2e3036] pt-8 animate-fadeIn">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xs font-medium uppercase tracking-wider text-[#9fa2ac]">Available Formats</h3>
                    <span id="videoTitle" class="text-xs text-[#9fa2ac] font-mono truncate max-w-[300px]"></span>
                </div>
                
                <div id="formatList" class="format-selector">
                    <!-- Populated by JS -->
                </div>

                <button id="convertBtn" class="hidden btn btn-primary w-full sm:w-auto min-w-[200px]">
                    <span id="btnContent">Start Download</span>
                    <span id="btnLoader" class="hidden flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        Encoding...
                    </span>
                </button>
            </div>

        </div>
    </main>

    <!-- Right: Sticky History -->
    <aside id="historySection" class="sidebar custom-scrollbar">
        <div class="flex items-center justify-between mb-6">
            <h2>History</h2>
            <button onclick="window.location.reload()" class="text-xs text-[#656870] hover:text-white transition-colors">Refresh</button>
        </div>
        
        <div id="historyListContainer" class="space-y-0">
             <!-- JS injects here -->
             <div id="historyList"></div>
        </div>
        
        <div id="historyEmpty" class="text-center py-12">
            <p class="text-sm text-[#656870]">No recent tasks.</p>
        </div>
    </aside>

</div>

<!-- Footer -->
<footer class="fixed bottom-4 left-6 text-[10px] text-[#656870] font-mono pointer-events-none">
    <span id="year"></span> © FETCHLY SYSTEMS
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="{{ url_for('static', filename='js/toast.js') }}?v={{ cache_version }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}?v={{ cache_version }}"></script>
</body>
</html>
