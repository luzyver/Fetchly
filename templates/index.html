<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamConvert - Professional Media Tools</title>
    <meta name="description" content="Secure, fast, and professional M3U8 to MP4 conversion service.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9', // Sky blue
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        },
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    },
                    backgroundImage: {
                        'grid-white': "url(\"data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='rgb(255 255 255 / 0.05)'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e")",
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col selection:bg-brand-500/30 selection:text-white">

    <!-- Background Pattern -->
    <div class="absolute inset-0 bg-grid-white/[0.05] bg-[bottom_1px_center] [mask-image:linear-gradient(to_bottom,transparent,black)] pointer-events-none -z-10"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent pointer-events-none -z-10"></div>
    <!-- Subtle glow -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-[500px] bg-brand-500/10 blur-[120px] rounded-full pointer-events-none -z-10"></div>

    <!--Navbar -->
    <nav class="border-b border-white/5 bg-slate-950/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded bg-gradient-to-br from-brand-500 to-blue-600 flex items-center justify-center shadow-lg shadow-brand-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <span class="text-lg font-bold text-white tracking-tight">
                        StreamConvert
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-8 relative">
        
        <div class="w-full max-w-2xl mx-auto space-y-10 z-10">
            
            <!-- Hero Text -->
            <div class="text-center space-y-4">
                <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight text-white">
                    Convert M3U8 Streams <br class="hidden sm:block" />
                    <span class="text-slate-400">to MP4 Format</span>
                </h1>
                <p class="text-lg text-slate-400 max-w-xl mx-auto leading-relaxed">
                    Securely download and convert HLS streams directly from your browser. High processing speed and reliability.
                </p>
            </div>

            <!-- Converter Card -->
            <div class="glass-panel rounded-2xl p-1 shadow-2xl shadow-black/50">
                <div class="bg-slate-900/50 rounded-xl p-6 sm:p-8 space-y-6">
                    
                    <div class="space-y-5">
                        <!-- URL Input -->
                        <div class="group">
                            <label for="url" class="block text-sm font-medium text-slate-300 mb-2 ml-1">Stream URL</label>
                            <div class="relative">
                                <input type="text" id="url" 
                                    class="block w-full px-4 py-3.5 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all font-mono text-sm shadow-sm"
                                    placeholder="https://example.com/playlist.m3u8">
                            </div>
                        </div>

                        <!-- Referer Input -->
                        <div class="group">
                            <div class="flex justify-between items-center mb-2 ml-1">
                                <label for="referer" class="block text-sm font-medium text-slate-300">Referer URL</label>
                                <span class="text-xs text-slate-500">Optional</span>
                            </div>
                            <div class="relative">
                                <input type="text" id="referer" 
                                    class="block w-full px-4 py-3.5 bg-slate-800/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all font-mono text-sm shadow-sm"
                                    placeholder="https://source-website.com">
                            </div>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <button id="convertBtn" onclick="startConvert()" 
                        class="w-full relative group overflow-hidden rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3.5 transition-all duration-200 shadow-lg shadow-brand-900/20 active:scale-[0.99]">
                        <div id="btnContent" class="flex items-center justify-center space-x-2">
                            <span>Start Conversion</span>
                            <svg class="w-4 h-4 text-brand-100 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        </div>
                        <!-- Loader -->
                        <div id="btnLoader" class="hidden flex items-center justify-center space-x-2">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>Processing Request...</span>
                        </div>
                    </button>

                    <!-- Status Panel -->
                    <div id="statusCard" class="hidden rounded-lg bg-slate-800/30 border border-slate-700/50 p-4 transition-all animate-fade-in-up">
                        <div class="flex items-start space-x-4">
                            <div id="statusIcon" class="flex-shrink-0 mt-0.5"></div>
                            <div class="flex-1 min-w-0 space-y-1">
                                <p id="statusTitle" class="text-sm font-semibold text-white"></p>
                                <p id="statusMessage" class="text-sm text-slate-400 leading-relaxed"></p>
                                
                                <!-- Progress Indicator -->
                                <div id="progressBarContainer" class="hidden mt-3 h-1 w-full bg-slate-700 rounded-full overflow-hidden">
                                    <div class="h-full bg-brand-500 animate-pulse w-1/3 rounded-full loading-bar-anim"></div>
                                </div>
                                <style>
                                    .loading-bar-anim { animation: loading 1.5s infinite ease-in-out; }
                                    @keyframes loading { 0% { transform: translateX(-100%); width: 20%; } 100% { transform: translateX(400%); width: 20%; } }
                                </style>

                                <!-- Action Buttons -->
                                <div id="actionArea" class="hidden mt-3">
                                    <a href="#" id="downloadBtn" class="inline-flex items-center justify-center w-full px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium rounded-md transition-colors shadow-sm">
                                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                        Download File
                                    </a>
                                </div>
                                
                                <!-- Error Display -->
                                <div id="errorArea" class="hidden mt-2">
                                    <p id="errorDetails" class="text-xs font-mono text-red-400 break-all"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trust Indicators -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 pt-4 border-t border-white/5">
                <div class="flex items-center space-x-3 text-slate-400">
                    <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="text-sm font-medium">Fast Processing</span>
                </div>
                <div class="flex items-center space-x-3 text-slate-400">
                    <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    <span class="text-sm font-medium">Auto-Deletion</span>
                </div>
                <div class="flex items-center space-x-3 text-slate-400">
                    <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    <span class="text-sm font-medium">Mobile Optimized</span>
                </div>
            </div>

        </div>
    </main>

    <footer class="py-8 text-center border-t border-white/5 mt-auto">
        <p class="text-slate-600 text-sm">
            &copy; <script>document.write(new Date().getFullYear())</script> StreamConvert.
        </p>
    </footer>

    <script>
        let currentTaskId = null;
        let pollInterval = null;

        const UI = {
            btn: document.getElementById('convertBtn'),
            btnContent: document.getElementById('btnContent'),
            btnLoader: document.getElementById('btnLoader'),
            statusCard: document.getElementById('statusCard'),
            statusIcon: document.getElementById('statusIcon'),
            statusTitle: document.getElementById('statusTitle'),
            statusMessage: document.getElementById('statusMessage'),
            progressBar: document.getElementById('progressBarContainer'),
            actionArea: document.getElementById('actionArea'),
            downloadBtn: document.getElementById('downloadBtn'),
            errorArea: document.getElementById('errorArea'),
            errorDetails: document.getElementById('errorDetails')
        };

        const ICONS = {
            processing: `<div class="rounded-full bg-brand-500/10 p-2"><svg class="h-5 w-5 text-brand-500 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></div>`,
            completed: `<div class="rounded-full bg-emerald-500/10 p-2"><svg class="h-5 w-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div>`,
            failed: `<div class="rounded-full bg-red-500/10 p-2"><svg class="h-5 w-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></div>`
        };

        function setLoading(isLoading) {
            UI.btn.disabled = isLoading;
            if (isLoading) {
                UI.btnContent.classList.add('hidden');
                UI.btnLoader.classList.remove('hidden');
                UI.btn.classList.add('opacity-80', 'cursor-not-allowed');
            } else {
                UI.btnContent.classList.remove('hidden');
                UI.btnLoader.classList.add('hidden');
                UI.btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }

        async function startConvert() {
            const url = document.getElementById('url').value.trim();
            const referer = document.getElementById('referer').value.trim();

            if (!url) {
                alert('Please enter a valid M3U8 URL');
                return;
            }

            setLoading(true);
            UI.statusCard.classList.add('hidden');
            UI.errorArea.classList.add('hidden');

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, referer })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Conversion failed to start');

                currentTaskId = data.task_id;
                
                UI.statusCard.classList.remove('hidden');
                updateStatusUI('processing');
                
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(checkStatus, 3000);

            } catch (error) {
                setLoading(false);
                UI.statusCard.classList.remove('hidden');
                updateStatusUI('failed', error.message);
            }
        }

        async function checkStatus() {
            if (!currentTaskId) return;

            try {
                const response = await fetch(`/status/${currentTaskId}`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();

                if (data.status === 'completed') {
                    clearInterval(pollInterval);
                    updateStatusUI('completed');
                    setLoading(false);
                } else if (data.status === 'failed') {
                    clearInterval(pollInterval);
                    updateStatusUI('failed', data.error);
                    setLoading(false);
                }
            } catch (error) {
                console.error('Polling error:', error);
            }
        }

        function updateStatusUI(status, message = '') {
            UI.statusIcon.innerHTML = ICONS[status] || ICONS.processing;
            
            if (status === 'processing') {
                UI.statusTitle.textContent = 'Processing Video...';
                UI.statusMessage.textContent = 'We are downloading and converting your stream.';
                UI.progressBar.classList.remove('hidden');
                UI.actionArea.classList.add('hidden');
                UI.errorArea.classList.add('hidden');
            } else if (status === 'completed') {
                UI.statusTitle.textContent = 'Conversion Successful';
                UI.statusMessage.textContent = 'Your video is ready for download.';
                UI.progressBar.classList.add('hidden');
                UI.actionArea.classList.remove('hidden');
                UI.errorArea.classList.add('hidden');
                UI.downloadBtn.href = `/download/${currentTaskId}`;
            } else if (status === 'failed') {
                UI.statusTitle.textContent = 'Conversion Failed';
                UI.statusMessage.textContent = 'Error occurred during processing.';
                UI.progressBar.classList.add('hidden');
                UI.actionArea.classList.add('hidden');
                UI.errorArea.classList.remove('hidden');
                UI.errorDetails.textContent = message || 'Unknown error occurred.';
            }
        }
    </script>
</body>
</html>
