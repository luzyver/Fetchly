services:
  2mp4:
    build: .
    container_name: 2mp4
    restart: unless-stopped
    expose:
      - "5050"
    environment:
      - FLASK_ENV=production
      - INSTAGRAM_USERNAME=${INSTAGRAM_USERNAME}
      - INSTAGRAM_PASSWORD=${INSTAGRAM_PASSWORD}
      - INSTAGRAM_SESSION_FILE=/app/data/instagram_session
    volumes:
      - ./downloads:/app/downloads
      - ./config/cookies.txt:/app/cookies.txt
      - ./logs:/app/logs
      - ./data:/app/data
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nginx_default

networks:
  nginx_default:
    external: true
