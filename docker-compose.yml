services:
  2mp4:
    build: .
    container_name: 2mp4
    restart: unless-stopped
    expose:
      - "5050"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./downloads:/app/downloads
      - ./config/cookies.txt:/app/cookies.txt
      - ./config/tiktok_cookies.txt:/app/tiktok_cookies.txt
    networks:
      - nginx_default

networks:
  nginx_default:
    external: true
