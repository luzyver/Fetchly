services:
  web:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && uvicorn fetchly.asgi:application --host 0.0.0.0 --port 5050 --workers 3"
    ports:
      - "127.0.0.1:${FETCHLY_PORT:-5050}:5050"
    environment: &fetchly-environment
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      MONGODB_URI: mongodb://mongodb:27017/fetchly
      MONGODB_NAME: fetchly
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_ROOT: /app/data/downloads
      RESOLVER_ENCRYPTION_KEYS: ${RESOLVER_ENCRYPTION_KEYS}
      IDENTITY_HMAC_KEYS: ${IDENTITY_HMAC_KEYS}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-127.0.0.1/32,::1/128}
    volumes:
      - ./data/downloads:/app/data/downloads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  worker:
    build: .
    restart: unless-stopped
    command: python -m fetchly.worker
    environment: *fetchly-environment
    volumes:
      - ./data/downloads:/app/data/downloads
    depends_on:
      web:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from django.conf import settings; from redis import Redis; raise SystemExit(0 if Redis.from_url(settings.REDIS_URL).get(settings.WORKER_HEARTBEAT_KEY) else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - ./data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
