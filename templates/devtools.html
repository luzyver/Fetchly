<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetchly</title>
    <meta name="theme-color" content="#0f0f23">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { dark: { 950: '#0f0f23', 900: '#13132b' }, accent: { 500: '#f59e0b' } } } }
        }
    </script>
</head>
<body class="bg-dark-950 text-gray-200 min-h-screen flex items-center justify-center p-4 font-['Inter']">
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-accent-500/10 rounded-full blur-[120px]"></div>
    </div>
    <div class="relative z-10 text-center max-w-md mx-auto space-y-6">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-dark-900/50 border border-white/10 mb-2">
            <svg class="w-10 h-10 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <div class="space-y-2">
            <h1 class="text-2xl font-bold text-white">Session Interrupted</h1>
            <p class="text-gray-400 text-sm">Please close developer tools and refresh the page to continue using Fetchly.</p>
        </div>
        <button onclick="window.location.href='/'" class="inline-flex items-center gap-2 px-6 py-3 text-sm font-medium text-white bg-dark-900 border border-white/10 rounded-xl hover:bg-dark-900/80 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Refresh Page
        </button>
    </div>
</body>
</html>
