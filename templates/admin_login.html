<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Fetchly</title>
    <meta name="theme-color" content="#0b0c0e">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v={{ cache_version }}">
    <script src="https://cdn.tailwindcss.com"></script>
    {% if captcha_enabled %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {% endif %}
</head>
<body class="bg-[var(--bg-body)] min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-2 mb-4">
                <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <span class="font-semibold text-white text-lg">Fetchly</span>
            </div>
            <h1 class="text-2xl font-semibold text-white mb-2">Admin Access</h1>
            <p class="text-sm text-[var(--text-muted)]">Enter password to continue</p>
        </div>

        <form method="POST" id="loginForm" class="space-y-4">
            {% if error %}
            <div class="bg-red-500/10 border border-red-500/20 rounded-lg px-4 py-3 text-sm text-red-400">
                {{ error }}
            </div>
            {% endif %}
            
            <div>
                <input type="password" name="password" placeholder="Password" autofocus required
                    class="w-full bg-[var(--bg-surface)] border border-[var(--border-subtle)] rounded-lg px-4 py-3 text-white placeholder-[var(--text-faint)] focus:border-[var(--border-focus)] focus:outline-none">
            </div>
            
            {% if captcha_enabled %}
            <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-theme="dark" data-callback="onTurnstileSuccess"></div>
            <div id="captchaStatus" class="text-xs text-[var(--text-muted)] flex items-center gap-1 mt-2">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                <span id="captchaText">Verifying...</span>
            </div>
            <script>
                function onTurnstileSuccess() {
                    document.getElementById('captchaStatus').classList.remove('text-[var(--text-muted)]');
                    document.getElementById('captchaStatus').classList.add('text-emerald-500');
                    document.getElementById('captchaText').textContent = 'Verified';
                }
            </script>
            {% endif %}
            
            <button type="submit" class="w-full bg-white text-black font-medium py-3 px-4 rounded-lg hover:bg-gray-200 transition-colors">
                Login
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-sm text-[var(--text-muted)] hover:text-white transition-colors">← Back to home</a>
        </div>
    </div>
</body>
</html>
