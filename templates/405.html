<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Method Not Allowed - StreamConvert</title>
    <meta name="theme-color" content="#020617">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='js/tailwind_config.js') }}"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-4">
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[60%] h-[60%] bg-red-600/5 rounded-full blur-[120px]"></div>
    </div>
    <div class="relative z-10 text-center max-w-md mx-auto space-y-6">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-slate-900/50 border border-slate-800 shadow-2xl shadow-red-500/10 mb-2">
            <span class="text-4xl font-bold text-red-400/80">405</span>
        </div>
        <div class="space-y-2">
            <h1 class="text-2xl font-bold text-white tracking-tight">Method Not Allowed</h1>
            <p class="text-slate-400 text-sm leading-relaxed">
                The request method is not supported for this resource.
            </p>
        </div>
        <div class="pt-4">
            <a href="/" class="inline-flex items-center justify-center px-6 py-3 text-sm font-medium text-white transition-all bg-slate-900 border border-slate-800 rounded-lg hover:bg-slate-800 hover:border-slate-700 focus:outline-none focus:ring-2 focus:ring-red-500/20 active:scale-95">
                <svg class="w-4 h-4 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Return Home
            </a>
        </div>
    </div>
</body>
</html>
