services:
  2mp4:
    build: .
    container_name: 2mp4
    restart: unless-stopped
    expose:
      - "5050"
    environment:
      - FLASK_ENV=production
      - PROXY=socks5://warp:1080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./downloads:/app/downloads
      - ./config/cookies.txt:/app/cookies.txt
      - ./logs:/app/logs
      - ./data:/app/data
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nginx_default
    depends_on:
      - warp

  warp:
    image: caomingjun/warp
    container_name: warp
    restart: unless-stopped
    environment:
      - WARP_SLEEP=2
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./data/warp:/var/lib/cloudflare-warp
    networks:
      - nginx_default

networks:
  nginx_default:
    external: true
